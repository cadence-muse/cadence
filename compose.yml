services:
  cadence:
    container_name: cadence
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CADENCE_DB_HOST: cadence-db
      CADENCE_DB_PORT: 5432
      CADENCE_DB_NAME: cadence
      CADENCE_DB_USER: cadence
      CADENCE_DB_PASSWORD: RTYL9d
      CADENCE_DB_MAX_CONN: 10
      CADENCE_DB_CONN_LIFETIME: 60

      CADENCE_REDIS_HOST: cadence-redis
      CADENCE_REDIS_PORT: 6379
      CADENCE_REDIS_PASSWORD: 3GN5gU
      CADENCE_REDIS_DB: 0

      CADENCE_SESSION_MAX_PER_USER: 5
      CADENCE_SESSION_TTL: 24h

      CADENCE_CORS_ALLOWED_ORIGINS: http://localhost:33721
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      cadence-db:
        condition: service_healthy
      cadence-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/resilience/ready" ]
      interval: 5s
      timeout: 5s
      retries: 5

  cadence-db:
    image: postgres:16-alpine
    container_name: cadence-db
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: RTYL9d
      POSTGRES_DB: cadence
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "cadence-db-data:/var/lib/postgresql/data"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cadence -d cadence" ]
      interval: 5s
      timeout: 5s
      retries: 5

  cadence-redis:
    image: redis:7-alpine
    container_name: cadence-redis
    command: [ "redis-server", "--requirepass", "3GN5gU" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "cadence-redis-data:/data"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "3GN5gU", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cadence-db-data:
  cadence-redis-data:
