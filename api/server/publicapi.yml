openapi: 3.0.0

info:
  title: Cadence public API
  version: 1.0.0

tags:
  - name: Bands
  - name: Songs

security:
  - sessionAuth: [ ]

paths:
  /api/register:
    post:
      operationId: Register
      summary: Registers a new user
      tags: [ Users ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/login:
    post:
      operationId: Login
      summary: Logs in the user and returns token
      tags: [ Users ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/me:
    get:
      operationId: GetUserProfile
      summary: Get logged in user profile info
      tags: [ Users ]
      security:
        - sessionAuth: [ ]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/homepage:
    get:
      operationId: GetHomepageData
      summary: Get homepage data for current user
      tags: [ Users ]
      security:
        - sessionAuth: [ ]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomepageData'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/list:
    get:
      operationId: ListBands
      summary: Returns a list of current user's bands
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBandsResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band:
    post:
      operationId: CreateBand
      summary: Create a new band
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBandRequestBody'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBandResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}:
    get:
      operationId: GetBand
      summary: Get detailed band info
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Band'
        '400':
          $ref: '#/components/responses/BadRequest'

    put:
      operationId: UpdateBand
      summary: Update band info
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBandRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/join:
    post:
      operationId: JoinBand
      summary: Join a band by invite code
      security:
        - sessionAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinBandRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/track/list:
    get:
      operationId: ListBandTracks
      summary: List all band tracks
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBandTracksResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/track:
    post:
      operationId: CreateBandTrack
      summary: Create band track
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBandTrackRequestBody'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBandTrackResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/track/{trackId}:
    get:
      operationId: GetBandTrack
      summary: Get detailed band track info
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandTrack'
        '400':
          $ref: '#/components/responses/BadRequest'

    put:
      operationId: UpdateBandTrack
      summary: Update band track info
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/TrackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBandTrackRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Session ID passed via the Authorization header

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestResponseBody'

  parameters:
    BandId:
      name: bandId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    BadRequestResponseBody:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: Invalid data
        data:
          $ref: '#/components/schemas/ErrorData'
      required:
        - code
        - message

    ErrorCode:
      type: string
      enum:
        - invalid_input
        - not_found
        - permission_denied
        - operation_rejected
        - already_exists

    ErrorData:
      type: object
      additionalProperties: true
      description: additional information about the error

    RegisterRequestBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required:
        - username
        - password

    RegisterResponseBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    LoginRequestBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required:
        - username
        - password

    LoginResponseBody:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    UserProfile:
      type: object
      properties:
        username:
          type: string
      required:
        - username

    HomepageData:
      type: object
      properties:
        username:
          type: string
        bandsCount:
          type: integer
      required:
        - username
        - bandsCount

    ListBandsResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BandListItem'
      required:
        - items

    BandListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name

    CreateBandRequestBody:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    CreateBandResponseBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    Band:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/BandMember'
        inviteCode:
          type: string
      required:
        - id
        - name
        - members
        - inviteCode

    BandMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
      required:
        - username

    UpdateBandRequestBody:
      type: object
      properties:
        name:
          type: string

    JoinBandRequestBody:
      type: object
      properties:
        inviteCode:
          type: string
      required:
        - inviteCode

    ListBandTracksResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackListItem'
      required:
        - items

    TrackListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
      required:
        - id
        - title
        - artist

    CreateBandTrackRequestBody:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
        tempo:
          type: integer
        key:
          type: string
        notes:
          type: string
      required:
        - title
        - artist

    CreateBandTrackResponseBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    BandTrack:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
        tempo:
          type: integer
        key:
          type: string
        notes:
          type: string
      required:
        - id
        - title
        - artist

    UpdateBandTrackRequestBody:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
          nullable: true
        tempo:
          type: integer
          nullable: true
        key:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
