openapi: 3.0.0

info:
  title: Cadence public API
  version: 1.0.0

tags:
  - name: Users
  - name: Bands
  - name: Tracks
  - name: Setlists

security:
  - sessionAuth: [ ]

paths:
  /api/register:
    post:
      operationId: Register
      summary: Registers a new user
      tags: [ Users ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/login:
    post:
      operationId: Login
      summary: Logs in the user and returns token
      tags: [ Users ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/logout:
    post:
      operationId: Logout
      summary: Remove user session
      tags: [ Users ]
      security:
        - sessionAuth: [ ]
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/me:
    get:
      operationId: GetUserProfile
      summary: Get logged in user profile info
      tags: [ Users ]
      security:
        - sessionAuth: [ ]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/me/password:
    post:
      operationId: ChangeUserPassword
      summary: Change user password
      tags: [ Users ]
      security:
        - sessionAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserPasswordRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/homepage:
    get:
      operationId: GetHomepageData
      summary: Get homepage data for current user
      tags: [ Users ]
      security:
        - sessionAuth: [ ]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomepageData'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/list:
    get:
      operationId: ListBands
      summary: Returns a list of current user's bands
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBandsResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band:
    post:
      operationId: CreateBand
      summary: Create a new band
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBandRequestBody'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBandResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}:
    get:
      operationId: GetBand
      summary: Get detailed band info
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Band'
        '400':
          $ref: '#/components/responses/BadRequest'

    put:
      operationId: UpdateBand
      summary: Update band info, allowed for any member
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBandRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      operationId: Remove band
      summary: Remove the band, only allowed to the band owner
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/join:
    post:
      operationId: JoinBand
      summary: Join a band by invite code
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinBandRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/remove-member/{userId}:
    delete:
      operationId: RemoveBandMember
      summary: Remove band member by user ID, you can remove yourself and owner can remove anybody from the band
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/rotate-invite-code:
    post:
      operationId: RotateBandInviteCode
      summary: Regenerate band invite code, available only to owner
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateBandInviteCodeResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/transfer-ownership:
    post:
      operationId: TransferBandOwnership
      summary: Transfer band ownership to one if its members, only available to owner
      tags: [ Bands ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferBandOwnershipRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/track/list:
    get:
      operationId: ListBandTracks
      summary: List all band tracks
      tags: [ Tracks ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBandTracksResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/track:
    post:
      operationId: CreateBandTrack
      summary: Create band track, available to any member
      tags: [ Tracks ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBandTrackRequestBody'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBandTrackResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/track/{trackId}:
    get:
      operationId: GetBandTrack
      summary: Get detailed band track info
      tags: [ Tracks ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandTrack'
        '400':
          $ref: '#/components/responses/BadRequest'

    put:
      operationId: UpdateBandTrack
      summary: Update band track info, available to any member
      tags: [ Tracks ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/TrackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBandTrackRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      operationId: RemoveBandTrack
      summary: Remove band track, available to any member
      tags: [ Tracks ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/TrackId'
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/track/list:
    get:
      operationId: ListUserTracks
      summary: List all tracks across bands the current user belongs to, optionally filtered by band
      tags: [ Tracks ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandIdFilter'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserTracksResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/setlist/list:
    get:
      operationId: ListUserSetlists
      summary: List all setlists across bands the current user belongs to, optionally filtered by band
      tags: [ Setlists ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandIdFilter'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserSetlistsResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/setlist/list:
    get:
      operationId: ListBandSetlists
      summary: List band setlists
      tags: [ Setlists ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBandSetlistsResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/setlist:
    post:
      operationId: CreateBandSetlist
      summary: Create a setlist, available to any band member
      tags: [ Setlists ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBandSetlistsRequestBody'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBandSetlistsResponseBody'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/setlist/{setlistId}:
    get:
      operationId: GetBandSetlist
      summary: Get band setlist detailed info
      tags: [ Setlists ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/SetlistId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandSetlist'
        '400':
          $ref: '#/components/responses/BadRequest'

    put:
      operationId: UpdateBandSetlist
      summary: Update band setlist, available to any band member
      tags: [ Setlists ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/SetlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBandSetlistRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      operationId: RemoveBandSetlist
      summary: Remove band setlist, available to any band member
      tags: [ Setlists ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/SetlistId'
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/setlist/{setlistId}/tracks:
    post:
      operationId: AddSetlistTracks
      summary: Add tracks to a setlist, available to any band member
      tags: [ Setlists ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/SetlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSetlistTracksRequestBody'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

    delete:
      operationId: RemoveSetlistTracks
      summary: Remove a track from a setlist
      tags: [ Setlists ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/SetlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveSetlistTracksRequestBody'
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/band/{bandId}/setlist/{setlistId}/tracks/reorder:
    put:
      operationId: ReorderSetlistTracks
      summary: Reorder the tracks of a setlist
      tags: [ Setlists ]
      security:
        - sessionAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/BandId'
        - $ref: '#/components/parameters/SetlistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderSetlistTracksRequestBody'
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Session ID passed via the Authorization header

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestResponseBody'

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    BandId:
      name: bandId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SetlistId:
      name: setlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    BandIdFilter:
      name: bandId
      in: query
      required: false
      schema:
        type: string
        format: uuid

    SearchQuery:
      name: searchQuery
      in: query
      required: false
      schema:
        type: string
      description: Case-insensitive substring match query

  schemas:
    BadRequestResponseBody:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: Invalid data
        data:
          $ref: '#/components/schemas/ErrorData'
      required:
        - code
        - message

    ErrorCode:
      type: string
      enum:
        - invalid_input
        - not_found
        - permission_denied
        - operation_rejected
        - already_exists

    ErrorData:
      type: object
      additionalProperties: true
      description: additional information about the error

    RegisterRequestBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          minLength: 8
      required:
        - username
        - password

    RegisterResponseBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    LoginRequestBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required:
        - username
        - password

    LoginResponseBody:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
      required:
        - id
        - username

    ChangeUserPasswordRequestBody:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
      required:
        - currentPassword
        - newPassword

    HomepageData:
      type: object
      properties:
        username:
          type: string
        bandsCount:
          type: integer
      required:
        - username
        - bandsCount

    ListBandsResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BandListItem'
      required:
        - items

    BandListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        membersCount:
          type: integer
        ownerId:
          type: string
          format: uuid
      required:
        - id
        - name
        - membersCount

    CreateBandRequestBody:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    CreateBandResponseBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    Band:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        members:
          type: array
          items:
            $ref: '#/components/schemas/BandMember'
        inviteCode:
          type: string
      required:
        - id
        - name
        - ownerId
        - members
        - inviteCode

    BandMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/BandMemberRole'
      required:
        - id
        - username
        - role

    BandMemberRole:
      type: string
      enum: [ owner, member ]

    UpdateBandRequestBody:
      type: object
      properties:
        name:
          type: string

    JoinBandRequestBody:
      type: object
      properties:
        inviteCode:
          type: string
      required:
        - inviteCode

    RotateBandInviteCodeResponseBody:
      type: object
      properties:
        newInviteCode:
          type: string
      required:
        - newInviteCode

    TransferBandOwnershipRequestBody:
      type: object
      properties:
        userId:
          type: string
          format: uuid
      required:
        - userId

    ListBandTracksResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackListItem'
      required:
        - items

    TrackListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
        key:
          type: string
      required:
        - id
        - title
        - artist

    CreateBandTrackRequestBody:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
        tempo:
          type: integer
        key:
          type: string
        notes:
          type: string
      required:
        - title
        - artist

    CreateBandTrackResponseBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    BandTrack:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
        tempo:
          type: integer
        key:
          type: string
        notes:
          type: string
      required:
        - id
        - title
        - artist

    UpdateBandTrackRequestBody:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
          nullable: true
        tempo:
          type: integer
          nullable: true
        key:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    ListUserTracksResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserTrackListItem'
      required:
        - items

    UserTrackListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
        bandId:
          type: string
          format: uuid
        bandName:
          type: string
      required:
        - id
        - title
        - artist
        - bandId
        - bandName

    ListBandSetlistsResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SetlistListItem'
      required:
        - items

    SetlistListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tracksCount:
          type: integer
        durationSeconds:
          type: integer
        eventDate:
          type: string
          format: date
        eventLocation:
          type: string
      required:
        - id
        - name
        - tracksCount
        - durationSeconds

    ListUserSetlistsResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSetlistListItem'
      required:
        - items

    UserSetlistListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tracksCount:
          type: integer
        durationSeconds:
          type: integer
        eventDate:
          type: string
          format: date
        bandId:
          type: string
          format: uuid
        bandName:
          type: string
      required:
        - id
        - name
        - tracksCount
        - durationSeconds
        - bandId
        - bandName

    CreateBandSetlistsRequestBody:
      type: object
      properties:
        name:
          type: string
        eventLocation:
          type: string
        eventDate:
          type: string
          format: date
        trackIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
      required:
        - name

    CreateBandSetlistsResponseBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    BandSetlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        durationSeconds:
          type: integer
        eventLocation:
          type: string
        eventDate:
          type: string
          format: date
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/SetlistTrackItem'
      required:
        - id
        - name
        - durationSeconds
        - tracks

    SetlistTrackItem:
      type: object
      properties:
        trackId:
          type: string
          format: uuid
        position:
          type: integer
        title:
          type: string
        artist:
          type: string
        durationSeconds:
          type: integer
      required:
        - trackId
        - position
        - title
